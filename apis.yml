name: ThreatTrack Security
description: 'ThreatTrack Security was a cybersecurity vendor focused on advanced malware
  analysis and threat intelligence, known for its ThreatAnalyzer dynamic malware sandbox,
  the ThreatIQ real-time threat intelligence feeds, and the VIPRE endpoint antivirus
  product line. The company traces to Sunbelt Software (founded 1994), which GFI Software
  acquired in 2010; GFI spun the security unit out in 2013 to form ThreatTrack Security.
  ThreatTrack was acquired by Ziff Davis / J2 Global in early 2018 and the brand was
  folded into VIPRE Security Group, so ThreatTrack no longer operates as an independent
  company. Its historical developer surface was an OEM/on-premise integration API for
  ThreatAnalyzer (JSON/XML output) and ThreatIQ intelligence feeds rather than a public,
  self-service developer platform. It was surfaced as a portfolio company of Bessemer
  Venture Partners and added to the API Evangelist network for enrichment.'
